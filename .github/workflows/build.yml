name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AutoDrop.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - run: cd AutoDrop && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoDrop-APK
          path: AutoDrop/app/build/outputs/apk/debug/*.apk
